services:
  - type: web
    name: feedback-management-system
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # Set this manually in Render dashboard — do NOT commit the value
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard — do NOT commit the value
      - key: CLIENT_URL
        sync: false   # Set to your Render service URL, e.g. https://feedback-management-system.onrender.com
